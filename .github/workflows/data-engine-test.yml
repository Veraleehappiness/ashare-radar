name: V0.7 Historical Data Engine Tests
on:
  push:
    branches: [main]
    paths:
      - 'data_engine/**'
      - 'tests/test_data_engine.py'
      - 'tests/test_history_cli.py'
      - 'tests/test_history_100.py'
      - 'scripts/stock_pool_100.py'
      - 'scripts/quote_recovery.py'
      - 'scripts/scan_historical_100.py'
      - 'scripts/merge_history_reports.py'
      - 'scripts/update_history_store.py'
      - 'requirements-history.txt'
      - '.github/workflows/data-engine-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-history.txt
      - name: Install tested data dependencies
        run: python -m pip install -r requirements-history.txt
      - name: Validate history engine and CLI without network
        run: python -m pytest tests/test_data_engine.py tests/test_history_cli.py tests/test_history_100.py -v
      - name: Compile package and CLI
        run: python -m compileall -q data_engine scripts/update_history_store.py scripts/stock_pool_100.py scripts/scan_historical_100.py scripts/quote_recovery.py scripts/merge_history_reports.py
