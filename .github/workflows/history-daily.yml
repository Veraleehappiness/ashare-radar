name: V0.7 Pilot Historical Database — daily incremental refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-daily.yml'
  workflow_dispatch:
  schedule:
    # 17:20 Asia/Shanghai (09:20 UTC), weekday; may start late on GitHub-hosted runners.
    - cron: '20 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ashare-v07-history-db
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-history.txt
      - name: Install real historic-data dependencies
        run: python -m pip install -r requirements-history.txt
      - name: Restore last verified Parquet from separated history branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ashare-history"
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch origin history:history
            for symbol in 600519 000001; do
              if git cat-file -e "history:history/${symbol}.parquet" 2>/dev/null; then
                git show "history:history/${symbol}.parquet" > "$RUNNER_TEMP/ashare-history/${symbol}.parquet"
              fi
            done
          fi
      - name: Incrementally fetch and validate REAL A-share bars
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.update_history_store \
            --codes 600519,000001 --start 20240101 --limit 2 \
            --root "$RUNNER_TEMP/ashare-history" \
            --report "$RUNNER_TEMP/history-health.json" \
            --retries 2
      - name: Publish ONLY verified public OHLCV files to history branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/heads/history; then
            git switch history
          else
            git switch --orphan history
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p history
          cp "$RUNNER_TEMP/ashare-history/600519.parquet" history/600519.parquet
          cp "$RUNNER_TEMP/ashare-history/000001.parquet" history/000001.parquet
          cp "$RUNNER_TEMP/history-health.json" data_health.json
          git add -f history/600519.parquet history/000001.parquet data_health.json
          if git diff --cached --quiet; then
            echo 'No changes to historical data'
            exit 0
          fi
          git commit -m 'history: preserve verified incremental A-share daily bars'
          git push origin history
      - name: Upload independently auditable run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-daily-history-health
          path: ${{ runner.temp }}/history-health.json
          if-no-files-found: warn
          retention-days: 10
