name: V0.7 Real Historical Data Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-real-akshare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-history.txt
      - name: Install historical data dependencies
        run: python -m pip install -r requirements-history.txt
      - name: Download two REAL stocks into temporary parquet
        shell: bash
        run: |
          python -m scripts.update_history_store \
            --codes 600519,000001 --start 20240101 --limit 2 \
            --root "$RUNNER_TEMP/ashare-test/stocks" \
            --report "$RUNNER_TEMP/ashare-test/health.json" \
            --retries 1
      - name: Archive actual Parquet and health audit, even on failed upstream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v07-history-real-smoke
          path: ${{ runner.temp }}/ashare-test/
          if-no-files-found: warn
          retention-days: 5
