name: AShare Radar market refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - 'scripts/enrich_research.py'
      - 'tests/test_research.py'
      - 'tests/test_tracker.py'
      - 'scripts/track_signals.py'
      - 'requirements-data.txt'
      - '.github/workflows/market-refresh.yml'
  schedule:
    # Beijing time 16:45 and 19:20, Mon-Fri
    - cron: '45 8 * * 1-5'
    - cron: '20 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install data dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Install AKQuant backtest engine (optional)
        continue-on-error: true
        run: python -m pip install 'akquant>=0.2.10,<0.4'
      - name: Install AlphaSift from pinned upstream commit (optional)
        continue-on-error: true
        run: python -m pip install 'git+https://github.com/ZhuLinsen/alphasift.git@7639195e6176f4af37086c282834a7c09dc3e4a3'
      - name: Run offline research tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build verified market data
        run: python scripts/build_data.py --max-history 30 --out "$RUNNER_TEMP/market.json"
      - name: Run optional AlphaSift and AKQuant research
        run: python scripts/enrich_research.py --input "$RUNNER_TEMP/market.json"
      - name: Build verifiable forward-signal scorecard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git show FETCH_HEAD:signal_ledger.json > "$RUNNER_TEMP/previous_ledger.json" 2>/dev/null || rm -f "$RUNNER_TEMP/previous_ledger.json"
          fi
          python scripts/track_signals.py --market "$RUNNER_TEMP/market.json" --previous "$RUNNER_TEMP/previous_ledger.json" --ledger-out "$RUNNER_TEMP/signal_ledger.json"
      - name: Publish public market-only JSON to data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git switch data
          else
            git switch --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/market.json" market.json
          cp "$RUNNER_TEMP/signal_ledger.json" signal_ledger.json
          git add -f market.json signal_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m 'market: update A-share nonpersonal snapshot'
          git push origin data
