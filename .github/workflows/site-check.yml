name: Validate frontend on site changes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'netlify.toml'
      - '.github/workflows/site-check.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check static site source
        run: |
          if [ ! -f site/index.html ]; then
            echo 'Frontend has not been imported yet. Run Import existing Netlify site into GitHub first.'
            exit 0
          fi
          test -s site/index.html
          test -s site/app.js
          test -s site/style.css
          node --check site/app.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path('site/config.json').read_text())
          assert cfg['market_data_url']=='https://raw.githubusercontent.com/Veraleehappiness/ashare-radar/data/market.json'
          page=Path('site/index.html').read_text()
          code=Path('site/app.js').read_text()
          assert ('Personal Research V0.6' in page or 'Personal Research V0.7' in page)
          assert all(x in page for x in ('data-page="strategies"','data-page="research"','data-page="tracking"'))
          assert all(x in code for x in ('function strategies()', 'function research()', 'function tracking()','strategy_library','research_backtests','signal_tracking'))
          assert 'ashare-radar-watch-v2' in code and 'ashare-radar-paper-v2' in code
          assert '/.netlify/scripts/hud' not in page
          assert 'site' in Path('netlify.toml').read_text()
          print('Frontend contract OK')
          PY
