[build]
  publish = "site"
  command = "echo Static AShare Radar site: no Hugo build"
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site netlify.toml; test $? -eq 0"

[build.environment]
  PYTHON_VERSION = "3.11"
